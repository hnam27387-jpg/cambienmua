<!-- Chèn đoạn mã này vào nơi bạn muốn hiển thị trong trang web tĩnh -->
<style>
    .smarthome-card {
        max-width: 400px;
        background: #1a202c;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        border: 1px solid #2d3748;
    }
    .video-preview {
        width: 100%;
        height: 220px;

        display: flex;
        align-items: center;

        position: relative;
    }
    .video-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .live-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #e53e3e;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
    }
    .card-content {
        padding: 20px;
    }
    .card-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
    }
    .card-status {
        color: #a0aec0;
        font-size: 14px;
        margin-top: 5px;
    }
    .btn-access {
        display: block;
        width: 100%;
        padding: 12px;
        background: #3182ce;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 10px;
        margin-top: 15px;
        font-weight: bold;
        transition: background 0.3s;
    }
    .btn-access:hover {
        background: #2b6cb0;
    }
</style>

    <div class="video-preview">
        <span class="live-badge">Live</span>

        <img src="https://cons-licence-compiled-exhibit.trycloudflare.com/video_feed" onerror="this.src='https://via.placeholder.com/400x220?text=Camera+Offline'">

    <div class="card-content">
        <h3 class="card-title">Hệ Thống Camera AI</h3>
        <p class="card-status">Trạng thái: Đang kết nối qua Cloudflare</p>
        
        <a href="https://cons-licence-compiled-exhibit.trycloudflare.com/" target="_blank" class="btn-access">

        </a>
